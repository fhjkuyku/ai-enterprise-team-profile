  <script id="team-return-script">
    (function () {
      const button = document.querySelector(".team-return-button");
      if (!button) return;
      button.addEventListener("click", function (event) {
        const params = new URLSearchParams(location.search);
        const returnTarget = params.get("return");
        if (!returnTarget) {
          if (params.get("from") === "team" && history.length > 1) {
            event.preventDefault();
            history.back();
          }
          return;
        }
        try {
          const returnUrl = new URL(returnTarget, location.href);
          if (!["http:", "https:", "file:"].includes(returnUrl.protocol)) return;
          event.preventDefault();
          location.href = returnUrl.href;
        } catch (error) {
          // Invalid return targets fall back to this product's carousel entry.
        }
      });
    })();

  <script>
    (() => {
      const pages = [...document.querySelectorAll('.page')];
      const current = document.getElementById('currentPage');
      const observer = new IntersectionObserver((entries) => {
        const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (visible) current.textContent = String(pages.indexOf(visible.target) + 1);
      }, { threshold: [0.35, 0.6, 0.85] });
      pages.forEach((page) => observer.observe(page));
    })();
  </script>
