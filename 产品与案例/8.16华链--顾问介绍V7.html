<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>8.16华链--顾问介绍V7</title>
  <style>
    :root { color-scheme: dark; --chrome: rgba(14,18,26,.80); --line: rgba(255,255,255,.18); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090c12; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    body { display: grid; place-items: center; }
    #deck { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; --ratio: 720/405; }
    .slide { display: none; width: 100%; height: 100%; place-items: center; padding: 0; }
    .slide.active { display: grid; }
    .slide img { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; object-fit: contain; box-shadow: 0 24px 80px rgba(0,0,0,.46); user-select: none; -webkit-user-drag: none; }
    #toolbar { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--chrome); backdrop-filter: blur(14px); z-index: 20; transition: opacity .2s ease; }
    body.idle #toolbar { opacity: 0; pointer-events: none; }
    button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.10); color: #fff; font-size: 20px; cursor: pointer; }
    button:hover, button:focus-visible { background: rgba(255,255,255,.22); outline: none; }
    #counter { min-width: 86px; text-align: center; color: rgba(255,255,255,.92); font-size: 14px; font-variant-numeric: tabular-nums; }
    #overview { position: fixed; inset: 0; display: none; overflow: auto; padding: 32px; background: rgba(6,8,12,.97); z-index: 30; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; align-content: start; }
    #overview.open { display: grid; }
    .thumb { margin: 0; cursor: pointer; }
    .thumb img { width: 100%; height: auto; display: block; border: 2px solid transparent; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .thumb:hover img, .thumb:focus-visible img { border-color: #8ec5ff; }
    .thumb figcaption { padding-top: 8px; color: rgba(255,255,255,.72); font-size: 13px; }
    #help { position: fixed; top: 14px; right: 16px; color: rgba(255,255,255,.62); font-size: 12px; z-index: 10; text-shadow: 0 1px 4px #000; }
    #return-to-team { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 25; min-height: 48px; display: inline-flex; align-items: center; gap: 9px; padding: 0 18px; border: 1px solid var(--line); border-radius: 999px; color: #fff; background: rgba(14,18,26,.88); box-shadow: 0 12px 34px rgba(0,0,0,.32); backdrop-filter: blur(14px); text-decoration: none; font-size: 14px; font-weight: 700; transition: background .18s ease, transform .18s ease; }
    #return-to-team:hover { background: #155eef; transform: translateY(-2px); }
    #return-to-team:focus-visible { outline: 3px solid rgba(142,197,255,.72); outline-offset: 3px; }
    @media (max-width: 700px) { #help { display: none; } #overview { padding: 18px; grid-template-columns: 1fr; } #return-to-team { min-height: 44px; padding: 0 14px; font-size: 13px; } }
    @media print { html, body { overflow: visible; background: #fff; } #deck { width: auto; height: auto; display: block; } .slide, .slide.active { display: block; width: 100%; height: auto; break-after: page; } .slide img { width: 100%; max-width: none; max-height: none; box-shadow: none; } #toolbar, #overview, #help, #return-to-team { display: none !important; } }
  </style>
</head>
<body>
  <a id="return-to-team" href="../AI企业落地团队介绍.html#members" aria-label="返回团队成员"><span aria-hidden="true">&#8592;</span><span>返回团队成员</span></a>
  <main id="deck" aria-label="Presentation">
    <section class="slide active" data-index="1" aria-label="Slide 1"><img loading="eager" decoding="async" fetchpriority="high" src="8.16华链--顾问介绍V7_assets/001.png" alt="Slide 1"></section>
    <section class="slide" data-index="2" aria-label="Slide 2"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/002.png" alt="Slide 2"></section>
    <section class="slide" data-index="3" aria-label="Slide 3"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/003.png" alt="Slide 3"></section>
    <section class="slide" data-index="4" aria-label="Slide 4"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/004.png" alt="Slide 4"></section>
    <section class="slide" data-index="5" aria-label="Slide 5"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/005.png" alt="Slide 5"></section>
    <section class="slide" data-index="6" aria-label="Slide 6"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/006.png" alt="Slide 6"></section>
    <section class="slide" data-index="7" aria-label="Slide 7"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/007.png" alt="Slide 7"></section>
    <section class="slide" data-index="8" aria-label="Slide 8"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/008.png" alt="Slide 8"></section>
    <section class="slide" data-index="9" aria-label="Slide 9"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/009.png" alt="Slide 9"></section>
    <section class="slide" data-index="10" aria-label="Slide 10"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/010.png" alt="Slide 10"></section>
    <section class="slide" data-index="11" aria-label="Slide 11"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/011.png" alt="Slide 11"></section>
    <section class="slide" data-index="12" aria-label="Slide 12"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/012.png" alt="Slide 12"></section>
    <section class="slide" data-index="13" aria-label="Slide 13"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/013.png" alt="Slide 13"></section>
    <section class="slide" data-index="14" aria-label="Slide 14"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/014.png" alt="Slide 14"></section>
    <section class="slide" data-index="15" aria-label="Slide 15"><img loading="lazy" decoding="async" src="8.16华链--顾问介绍V7_assets/015.png" alt="Slide 15"></section>
  </main>
  <div id="help">Left/Right: navigate &middot; O: overview &middot; F: fullscreen</div>
  <nav id="toolbar" aria-label="Slide controls">
    <button id="prev" type="button" title="Previous slide" aria-label="Previous slide">&#8249;</button>
    <span id="counter">1 / 15</span>
    <button id="next" type="button" title="Next slide" aria-label="Next slide">&#8250;</button>
    <button id="grid" type="button" title="Overview" aria-label="Overview">&#9638;</button>
    <button id="full" type="button" title="Fullscreen" aria-label="Fullscreen">F</button>
  </nav>
  <div id="overview" aria-label="Slide overview"></div>
  <script>
    const slides = [...document.querySelectorAll('.slide')];
    const counter = document.querySelector('#counter');
    const overview = document.querySelector('#overview');
    const returnToTeam = document.querySelector('#return-to-team');
    let current = Math.max(0, Math.min(slides.length - 1, Number(location.hash.slice(1)) - 1 || 0));
    let idleTimer;
    let touchStartX = null;

    returnToTeam.addEventListener('click', event => {
      const params = new URLSearchParams(location.search);
      const returnUrl = params.get('return');
      if (params.get('from') === 'team' && history.length > 1) {
        event.preventDefault();
        history.back();
        return;
      }
      if (returnUrl) {
        event.preventDefault();
        location.href = returnUrl;
        return;
      }
    });

    function show(index, updateHash = true) {
      current = (index + slides.length) % slides.length;
      slides.forEach((slide, i) => slide.classList.toggle('active', i === current));
      counter.textContent = `${current + 1} / ${slides.length}`;
      document.title = `${current + 1}/${slides.length} - ${slides[current].querySelector('img').alt}`;
      if (updateHash) {
        const slideUrl = new URL(location.href);
        slideUrl.hash = String(current + 1);
        history.replaceState(null, '', slideUrl.href);
      }
    }

    function toggleOverview(force) {
      const open = typeof force === 'boolean' ? force : !overview.classList.contains('open');
      overview.classList.toggle('open', open);
      if (open && !overview.childElementCount) {
        slides.forEach((slide, i) => {
          const figure = document.createElement('figure');
          figure.className = 'thumb';
          figure.tabIndex = 0;
          const image = slide.querySelector('img').cloneNode();
          const caption = document.createElement('figcaption');
          caption.textContent = `${i + 1}. ${image.alt}`;
          figure.append(image, caption);
          const choose = () => { show(i); toggleOverview(false); };
          figure.addEventListener('click', choose);
          figure.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') choose(); });
          overview.append(figure);
        });
      }
    }

    function wakeToolbar() {
      document.body.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('idle'), 2600);
    }

    document.querySelector('#prev').addEventListener('click', () => show(current - 1));
    document.querySelector('#next').addEventListener('click', () => show(current + 1));
    document.querySelector('#grid').addEventListener('click', () => toggleOverview());
    document.querySelector('#full').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
    document.addEventListener('mousemove', wakeToolbar);
    document.addEventListener('pointerdown', wakeToolbar);
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') { event.preventDefault(); show(current + 1); }
      else if (event.key === 'ArrowLeft' || event.key === 'PageUp') { event.preventDefault(); show(current - 1); }
      else if (event.key === 'Home') show(0);
      else if (event.key === 'End') show(slides.length - 1);
      else if (event.key.toLowerCase() === 'o') toggleOverview();
      else if (event.key.toLowerCase() === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      else if (event.key === 'Escape') toggleOverview(false);
      wakeToolbar();
    });
    document.addEventListener('touchstart', event => { touchStartX = event.changedTouches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', event => {
      if (touchStartX === null) return;
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 45) show(current + (delta < 0 ? 1 : -1));
      touchStartX = null;
    }, { passive: true });
    window.addEventListener('hashchange', () => show(Number(location.hash.slice(1)) - 1, false));
    show(current, false);
    wakeToolbar();
  </script>
</body>
</html>
